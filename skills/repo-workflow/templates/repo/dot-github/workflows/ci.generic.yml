name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TOOLCHAIN: add a pinned setup action here (setup-node, setup-go, ...).
      - run: {{INSTALL_CMD}}
      - run: {{LINT_CMD}}
      - run: {{BUILD_CMD}}
      - run: git diff --check

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TOOLCHAIN: add a pinned setup action here (setup-node, setup-go, ...).
      - run: {{INSTALL_CMD}}
      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: {{TEST_CMD}}

  # {{COMMON_JOBS}}
