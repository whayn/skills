name: PR conventions

# Separate from CI so that editing a PR title or body reruns only this check
# instead of cancelling and restarting the whole CI on the same head.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: PR conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check title and source branch without executing contributor code
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY'
          import os
          import re
          types = r"(?:feat|fix|docs|test|refactor|perf|build|ci|chore|revert)"
          title = os.environ["PR_TITLE"]
          branch = os.environ["PR_BRANCH"]
          assert len(title) <= 72, "PR title must be at most 72 characters"
          assert re.fullmatch(types + r"(?:\([a-z0-9][a-z0-9-]*\))?!?: [^\s].*", title), "Use type(scope): description"
          assert not title.endswith("."), "No trailing period in PR titles"
          if os.environ["PR_AUTHOR"] != "dependabot[bot]":
              assert re.fullmatch(types + r"/[a-z0-9]+(?:-[a-z0-9]+)*", branch), "Use type/kebab-description branches"
          print("PR title and branch follow the repository conventions")
          PY
