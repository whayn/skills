name: Bug report
description: A reproducible defect in currently implemented behavior.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Use synthetic data only; never attach
        credentials, private data or an unredacted log. Missing planned features
        are feature requests, not bugs.
  - type: input
    id: versions
    attributes:
      label: Versions and environment
      description: Revision or version, runtime versions, OS and interface.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps and synthetic inputs that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Error text, commands and results. Mark hypotheses as such.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked for duplicates and removed private data and secrets.
          required: true
